[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "otpguard"
version = "0.1.0"
description = "Decide whether an OTP SMS should be sent: SMS pumping, bombing and enumeration checks for any provider"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Muhammad Tanzil", email = "mtanzil666@gmail.com" }]
keywords = ["otp", "sms", "sms pumping", "fraud", "rate limiting", "security"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Topic :: Communications :: Telephony",
]
dependencies = ["phonenumbers>=8.13", "PyYAML>=6", "tzdata; platform_system == \"Windows\""]

[project.optional-dependencies]
redis = ["redis>=5"]
sql = ["SQLAlchemy>=2.0"]
server = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=7", "fakeredis[lua]>=2.20", "redis>=5", "SQLAlchemy>=2.0", "fastapi>=0.110", "httpx>=0.27"]

[project.urls]
Homepage = "https://github.com/mtanzil6/otpguard"
Issues = "https://github.com/mtanzil6/otpguard/issues"

[project.scripts]
otpguard = "otpguard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
